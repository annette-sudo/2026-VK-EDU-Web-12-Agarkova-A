<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In — AskPupkin</title>
  <link rel="icon" href="static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/css/bootstrap.min.css">
  <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
  <header class="border-bottom mb-4">
    <div class="container py-3">
      <div class="row align-items-center g-4">
        <div class="col-12 col-lg-8 d-flex flex-wrap align-items-center gap-3">
          <a href="index.html" class="logo">AskPupkin</a>
          <form class="header-search" action="index.html" method="get" role="search">
            <input type="search" name="q" class="form-control" placeholder="Search" aria-label="Search">
          </form>
          <a href="ask.html" class="btn btn-success">ASK!</a>
        </div>
        <div class="col-12 col-lg-4">
          <div class="user-block d-flex gap-3">
            <a href="login.html">log in</a>
            <a href="signup.html">register</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="container mb-4">
    <div class="row g-4">
      <main class="col-12 col-lg-8">
        <h1 class="h3">Log In</h1>
        <p class="form-error">Sorry, wrong password!</p>
        <form action="#" method="post">
          <div class="row mb-3">
            <label class="col-sm-3 col-form-label" for="login">Login</label>
            <div class="col-sm-6">
              <input type="text" class="form-control" id="login" name="login" maxlength="32" placeholder="Enter your login here" autocomplete="username" aria-describedby="login-hint">
              <div class="form-text" id="login-hint">Maximum 32 characters</div>
            </div>
          </div>
          <div class="row mb-3">
            <label class="col-sm-3 col-form-label" for="password">Password</label>
            <div class="col-sm-6">
              <input type="password" class="form-control is-invalid" id="password" name="password" maxlength="128" autocomplete="current-password" aria-invalid="true" aria-describedby="password-error">
              <p class="field-error" id="password-error">Wrong password</p>
            </div>
          </div>
          <div class="row">
            <div class="col-sm-6 offset-sm-3">
              <button type="submit" class="btn">Log in!</button>
              <p class="mt-3 mb-0"><a href="signup.html">create new account</a></p>
            </div>
          </div>
        </form>
      </main>

      <aside class="col-12 col-lg-4">
        <section class="mb-4">
          <h2 class="h4">Popular Tags</h2>
          <div class="d-flex flex-wrap gap-2">
            <a href="tag.html" class="badge">python</a>
            <a href="tag.html" class="badge">django</a>
            <a href="tag.html" class="badge">html</a>
            <a href="tag.html" class="badge">css</a>
            <a href="tag.html" class="badge">bootstrap</a>
            <a href="tag.html" class="badge">bender</a>
          </div>
        </section>
        <section>
          <h2 class="h4">Best Members</h2>
          <ul class="list-unstyled">
            <li><a href="#">Mr. Freeman</a></li>
            <li><a href="#">Dr. House</a></li>
            <li><a href="#">Bender</a></li>
            <li><a href="#">Queen Victoria</a></li>
            <li><a href="#">V. Pupkin</a></li>
          </ul>
        </section>
      </aside>
    </div>
  </div>

  <footer class="border-top mt-auto py-3 bg-light">
    <div class="container small text-muted">
      © 2026 AskPupkin — Q&A
    </div>
  </footer>
  <script src="static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
